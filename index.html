<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Cat Warrior: Ultimate Edition</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: none;
        background-color: black;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #canvas {
        border: 2px solid #444;
        background-color: #000;
        width: 800px;
        height: 600px;
      }
      #status {
        margin-top: 10px;
        color: #aaa;
      }
    </style>
  </head>
  <body>

    <h2>Cat Warrior</h2>
    
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    
    <div id="status">Loading Python environment...</div>

    <script type=text/javascript>
        window.addEventListener("load", function() {
            console.log("Page loaded, starting pygbag...");
        });
    </script>

    <!-- This script tag is required for Pygbag to hook into the page -->
    <script src="https://github.io"></script>
    
    <script>
        // Configuration for the WASM runner
        window.pythonConfig = {
            width: 800,
            height: 600,
            canvas: document.getElementById('canvas'),
            status: document.getElementById('status')
        };
    </script>

  </body>
</html>
